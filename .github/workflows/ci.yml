name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Replace outdated PR checks, but keep every production build eligible for release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Package the verified production build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_number }}
        run: |
          mkdir -p release
          tar -czf release/cska-stadium-explorer.tar.gz -C dist .
          printf 'Commit: %s\nCI build: %s\n' "$BUILD_SHA" "$BUILD_RUN" > release/build-info.txt
          cd release
          sha256sum cska-stadium-explorer.tar.gz > SHA256SUMS
      - name: Upload production build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-build-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      actions: read
      deployments: read
      statuses: read
    uses: ./.github/workflows/release.yml
